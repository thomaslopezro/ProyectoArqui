spring.application.name=reconstruccion

# API REST para la interfaz web y contrato gRPC para los demás módulos
server.port=8086
grpc.server.port=9096

# Por defecto usa H2 en memoria para desarrollo. En Docker Compose se reemplaza por PostgreSQL
# con las variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:mem:reconstruccion;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Carga un desastre y sus evaluaciones de ejemplo si la base está vacía
reconstruccion.datos-demo=true

# Plataforma integrada. Con integracion.habilitada=true la identidad sale del token validado
# contra el núcleo, los desastres se leen del núcleo y las evaluaciones de servidor.
# Con false (por defecto) el módulo corre solo, con sus tablas de referencia y datos de ejemplo.
reconstruccion.integracion.habilitada=false
reconstruccion.nucleo.url=http://localhost:18092/plataforma-desastres/api
reconstruccion.servidor.url=http://localhost:18085
reconstruccion.integracion.clave=

# Con mensajeria.habilitada=true la bandeja de salida se despacha a RabbitMQ.
reconstruccion.mensajeria.habilitada=false
