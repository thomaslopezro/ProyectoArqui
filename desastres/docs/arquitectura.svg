<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<rect width="1280" height="860" fill="#f4f7fb"/>
<style>text{font-family:Arial,sans-serif;fill:#18314c} .titulo{font-size:29px;font-weight:700} .sub{font-size:15px;fill:#53677f} .etiqueta{font-size:17px;font-weight:700} .detalle{font-size:14px} .flecha{fill:none;stroke:#53677f;stroke-width:2;marker-end:url(#flecha)} .caja{fill:white;stroke:#c2cedd;stroke-width:1.5;rx:12}</style>
<text x="48" y="55" class="titulo">Gestión de Emergencias · Taller 3</text>
<text x="48" y="83" class="sub">Capas en un contenedor Jakarta · RabbitMQ + Jakarta Mail · Docker Compose</text>
<rect x="350" y="245" width="555" height="440" rx="20" fill="#e6effb" stroke="#a6bfdc"/>
<text x="375" y="278" class="etiqueta">Payara / Jakarta EE — un WAR</text>
<rect x="45" y="125" width="250" height="85" class="caja"/>
<text x="65" y="158" class="etiqueta">Productor externo</text><text x="65" y="185" class="detalle">Publica JSON por AMQP</text>
<rect x="385" y="125" width="250" height="85" class="caja"/>
<text x="405" y="158" class="etiqueta">RabbitMQ: entrada</text><text x="405" y="185" class="detalle">desastres.registro · durable</text>
<path d="M295 168H385" class="flecha"/><text x="310" y="154" class="detalle">confirm</text>
<path d="M510 210V306" class="flecha"/>
<rect x="385" y="306" width="485" height="70" class="caja"/>
<text x="405" y="335" class="etiqueta">ProcesadorMensajes / adaptador de entrada</text><text x="405" y="358" class="detalle">Temporizador EJB · consumo con ACK manual</text>
<path d="M625 376V405" class="flecha"/>
<rect x="385" y="405" width="485" height="78" class="caja"/>
<text x="405" y="435" class="etiqueta">DesastreServicio / aplicación</text><text x="405" y="461" class="detalle">Validar · registrar · coordinar notificaciones</text>
<path d="M625 483V515" class="flecha"/>
<rect x="385" y="515" width="485" height="62" class="caja"/>
<text x="405" y="542" class="etiqueta">Puertos de salida</text><text x="405" y="563" class="detalle">RegistroRepositorio · NotificadorMensajes · NotificadorCorreo</text>
<rect x="385" y="605" width="485" height="54" class="caja"/>
<text x="405" y="637" class="detalle">Adaptadores: archivo JSON · RabbitMensajes · CorreoSmtp</text>
<path d="M625 577V605" class="flecha"/>
<rect x="45" y="405" width="250" height="100" class="caja"/>
<text x="65" y="439" class="etiqueta">API auxiliar REST</text><text x="65" y="464" class="detalle">Alta de sistemas y consultas</text><text x="65" y="487" class="detalle">POST desastre → cola (202)</text>
<path d="M295 444H385" class="flecha"/>
<rect x="45" y="610" width="250" height="95" class="caja"/>
<text x="65" y="643" class="etiqueta">Registro persistente</text><text x="65" y="669" class="detalle">Desastre + salida pendiente</text><text x="65" y="692" class="detalle">Volumen Docker</text>
<path d="M385 632H295" class="flecha"/>
<rect x="960" y="306" width="275" height="97" class="caja"/>
<text x="980" y="339" class="etiqueta">RabbitMQ: notificaciones</text><text x="980" y="365" class="detalle">Una cola durable por sistema</text><text x="980" y="388" class="detalle">Exchange desastres.notificaciones</text>
<path d="M870 625H925V355H960" class="flecha"/>
<rect x="960" y="445" width="275" height="80" class="caja"/>
<text x="980" y="476" class="etiqueta">Sistemas receptores</text><text x="980" y="503" class="detalle">Bomberos · Defensa Civil · otros</text>
<path d="M1097 403V445" class="flecha"/>
<rect x="960" y="605" width="275" height="100" class="caja"/>
<text x="980" y="638" class="etiqueta">SMTP / Mailpit</text><text x="980" y="665" class="detalle">Un correo por sistema</text><text x="980" y="688" class="detalle">Buzón web local verificable</text>
<path d="M870 648H925V655H960" class="flecha"/>
<text x="48" y="777" class="etiqueta">Productor y receptores no necesitan ejecutarse al mismo tiempo.</text>
<text x="48" y="808" class="sub">ACK después de registrar · publisher confirms · reintentos y colas de errores · deduplicación por ID</text>
<text x="48" y="834" class="sub">El correo se procesa desde su propia cola. La entrega es al menos una vez; pueden existir duplicados tras un fallo.</text>
</svg>
