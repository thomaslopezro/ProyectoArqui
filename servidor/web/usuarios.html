<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territorio · Usuarios</title><link rel="stylesheet" href="styles.css?v=030"><script defer src="auth.js?v=030"></script><script defer src="usuarios.js?v=030"></script></head><body><main style="max-width:620px;margin:5vh auto;padding:24px"><a href="/">Volver a mapas</a><h1>Usuarios del organismo</h1><p>El nuevo usuario pertenecerá a tu organización.</p><form id="nuevo-usuario"><label>Usuario<input id="usuario" required minlength="3" maxlength="80" pattern="[a-z0-9_.\-]{3,80}"></label><label>Contraseña inicial<input id="clave" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label>Rol<select id="rol"><option value="EVALUADOR">Evaluador · registra daños</option><option value="CONSULTA">Consulta · solo lectura</option></select></label><button>Crear usuario</button></form><p id="estado" role="status"></p></main></body></html>
