resolver 127.0.0.11 valid=5s ipv6=off;
upstream mapas_api {
    zone mapas_api 64k;
    server api:8080 resolve;
}
upstream reconstruccion_api {
    zone reconstruccion_api 64k;
    server reconstruccion:8086 resolve;
}
upstream reconstruccion_web {
    zone reconstruccion_web 64k;
    server reconstruccion-web:80 resolve;
}
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;
    client_max_body_size 2m;
    location = /api/campo/lotes {
        client_max_body_size 8m;
        proxy_pass http://mapas_api;
    }
    # UD-06 Reconstrucción: su API y su interfaz entran por la misma entrada
    location /api/reconstruccion/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://reconstruccion_api;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location = /reconstruccion { return 301 /reconstruccion/; }
    location /reconstruccion/ {
        proxy_pass http://reconstruccion_web/;
        proxy_connect_timeout 5s;
    }
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://mapas_api;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ =404; }
}
